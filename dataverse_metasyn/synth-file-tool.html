<html>
<head>
    <title>Synthetic Replicant File Tool</title>
</head>
<body>
    <h1>Synthetic Replicant File Tool</h1>
    <p>This tool can be used to generate a synthetic representation of a file. </p>

    <div id="status" aria-live="polite"></div>

    <div id="tool-info">
        <!-- This is where the tool's information will be displayed -->
    </div>
<script>
    const API_URL = 'http://127.0.0.1:8000';
    var g_fileMetadata;
    var g_fileContent;
    var g_isGmf = false;

    //--- Status and error reporting: logs to the console and shows the message on the page ---

    function showStatus(message) {
        console.log(message);
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '';
        statusDiv.textContent = message;
    }

    function showError(message, error) {
        console.error(message, error || '');
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = 'red';
        statusDiv.textContent = error ? `${message}: ${error.message || error}` : message;
    }

    // Rejects with the HTTP status and the error detail of the body for non-2xx responses.
    function checkResponse(response) {
        if (response.ok) {
            return response;
        }
        return response.text().then(body => {
            let detail = body;
            try {
                const json = JSON.parse(body);
                detail = typeof json.detail === 'string' ? json.detail : JSON.stringify(json.detail || json);
            } catch (e) {
                // body is not JSON, use it as is
            }
            throw new Error(`HTTP ${response.status} ${response.statusText}: ${detail}`);
        });
    }

    // get the GMF json from the Synth File Tool response
    function synthFileToolFitModel(fileContent) {
        showStatus('Fitting a model on the file content...');

        // Note that we have tab files, but we use csv for the content type
        // The api seem to handle it correctly
        const formData = new FormData();
        formData.append('file', new Blob([fileContent], { type: 'text/csv' }), 'input_data.csv');

        // No Content-Type header: the browser must set it to include the multipart boundary.
        fetch(API_URL + '/fit-model/', {
            method: 'POST',
            body: formData
        })
        .then(checkResponse)
        .then(response => response.json())
        .then(jsonData => {
            console.log('Fit model response:', jsonData);
            if (!jsonData.model_json) {
                throw new Error('the response does not contain model_json');
            }
            displayModelJson(jsonData.model_json);
            showStatus('Model fitted; the GMF JSON is shown below.');
        })
        .catch(error => {
            showError(`Fitting the model failed (is the Metasyn API running at ${API_URL}?)`, error);
        });
    }

    function synthFileToolSynthesize(fileContent) {
        let num_rows = 10; // Just testing with 10 rows for now

        let jsonData;
        try {
            jsonData = JSON.parse(fileContent);
        } catch (error) {
            showError('The file is not valid JSON', error);
            return;
        }
        const requestJson = {
            "model_json": jsonData,
            "num_rows": num_rows
        };
        showStatus(`Synthesizing ${num_rows} rows from the GMF file...`);
        console.log('Request JSON for synthesis:', requestJson);

        fetch(API_URL + '/synthesize/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestJson)
        })
        .then(checkResponse)
        .then(response => response.json())
        .then(result => {
            console.log('Synthesize response:', result);
            if (!result.synthetic_data_csv) {
                throw new Error('the response does not contain synthetic_data_csv');
            }
            displaySyntheticDataCsv(result.synthetic_data_csv);
            showStatus('Synthetic data created; it is shown below.');
        })
        .catch(error => {
            showError(`Synthesizing data failed (is the Metasyn API running at ${API_URL}?)`, error);
        });
    }

    //--- Display functions, adding elements to the tool-info div for demonstration purposes ---

    function displayModelJson(modelJson) {
        const outputDiv = document.getElementById('tool-info');
        const modelJsonDiv = document.createElement('div');
        modelJsonDiv.textContent = 'Model JSON:';
        outputDiv.appendChild(modelJsonDiv);
        // make the div 10 lines height and enable scrolling
        const modelJsonPre = document.createElement('pre');
        modelJsonPre.textContent = JSON.stringify(modelJson, null, 2);
        modelJsonPre.style.height = '10em';
        modelJsonPre.style.overflow = 'auto';
        outputDiv.appendChild(modelJsonPre);

        // enable download of the model JSON (GMF)
        const downloadLink = document.createElement('a');
        downloadLink.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(modelJson));
        downloadLink.download = 'gmf.json';
        downloadLink.textContent = 'Download Model JSON';
        document.getElementById('tool-info').appendChild(downloadLink);
    }

    function displaySyntheticDataCsv(syntheticDataCsv) {
        const outputDiv = document.getElementById('tool-info');
        const syntheticDataCsvDiv = document.createElement('div');
        syntheticDataCsvDiv.textContent = 'Synthetic Data CSV:';
        outputDiv.appendChild(syntheticDataCsvDiv);
        // make the div 10 lines height and enable scrolling
        const syntheticDataCsvPre = document.createElement('pre');
        syntheticDataCsvPre.textContent = syntheticDataCsv;
        syntheticDataCsvPre.style.height = '10em';
        syntheticDataCsvPre.style.overflow = 'auto';
        outputDiv.appendChild(syntheticDataCsvPre);

        // enable download of the synthetic data CSV
        const downloadLink = document.createElement('a');
        downloadLink.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(syntheticDataCsv);
        downloadLink.download = 'synthetic_data.csv';
        downloadLink.textContent = 'Download Synthetic Data CSV';
        document.getElementById('tool-info').appendChild(downloadLink);
    }

    function displayQueryParams(queryParams) {
        const outputDiv = document.getElementById('tool-info');
        const queryParamsResults = document.createElement('p');
        queryParamsResults.textContent = 'Tool Input:';
        outputDiv.appendChild(queryParamsResults);
        const queryList = document.createElement('ul');
        outputDiv.appendChild(queryList);
        // iterate over all query parameters and display them
        for (const [key, value] of Object.entries(queryParams)) {
            const li = document.createElement('li');
            li.textContent = `${key}: ${value}`;
            queryList.appendChild(li);
        }
    }

    // slightly different from displayQueryParams... object stuff
    function displayUrlParams(urlParams) {
        // iterate over all query parameters and show them
        const outputDiv = document.getElementById('tool-info');
        const queryParamsResults = document.createElement('p');
        queryParamsResults.textContent = 'Tool url params:';
        outputDiv.appendChild(queryParamsResults);
        const queryList = document.createElement('ul');
        outputDiv.appendChild(queryList);
        // iterate over all query parameters and display them
        urlParams.forEach((value, key) => {
            const li = document.createElement('li');
            li.textContent = `${key}: ${value}`;
            queryList.appendChild(li);
        });
    }

    function displayFileContent(fileContent) {
        const outputDiv = document.getElementById('tool-info');
        const fileContentDiv = document.createElement('div');
        fileContentDiv.textContent = 'File Content (first 10 lines):';
        outputDiv.appendChild(fileContentDiv);
        const fileLines = fileContent.split('\n').slice(0, 10);
        const fileLinesList = document.createElement('ul');
        fileLines.forEach(line => {
            const li = document.createElement('li');
            li.textContent = line;
            fileLinesList.appendChild(li);
        });
        outputDiv.appendChild(fileLinesList);
    }


    //--- Retrieval and Storing functions ---

    function retrieveJsonFile(queryParams) {
        if (queryParams.fileUrl) {
            showStatus('Retrieving the JSON file to check whether it is a GMF file...');
            return fetch(queryParams.fileUrl)
                .then(checkResponse)
                .then(response => response.text())
                .then(fileContent => {
                    g_fileContent = fileContent;

                    // determine if it is GMF (possibly valid?)
                    try {
                        const jsonData = JSON.parse(g_fileContent);

                        if (jsonData.gmf_version) {
                            // we might check that version
                            console.log('GMF file detected, version:', jsonData.gmf_version);
                            g_isGmf = true;
                        } else {
                            console.log('JSON file without gmf_version, not treated as a GMF file.');
                            g_isGmf = false;
                        }
                    } catch (error) {
                        console.warn('The file could not be parsed as JSON, not treated as a GMF file:', error);
                        g_isGmf = false;
                    }
                });
        }
        return Promise.resolve();
    }

    function fetchFileMetadata(versionUrl, fileId) {
        showStatus('Retrieving the dataset metadata...');
        return fetch(versionUrl)
            .then(checkResponse)
            .then(response => response.json())
            .then(datasetMetadata => {
                var datafiles = datasetMetadata.data && datasetMetadata.data.files;
                if (!datafiles) {
                    throw new Error('the dataset metadata does not contain a file list');
                }
                for (var entry in datafiles) {
                    if (JSON.stringify(datafiles[entry].dataFile.id) == fileId) {
                        return datafiles[entry].dataFile;
                    }
                }
                return null;
            });
    }

    // This function contains the logic to continue the process
    // using the query parameters.
    function continueWithParams(queryParams) {
        console.log('Continuing with parameters:', queryParams);

        displayQueryParams(queryParams);

        // Check for essential query parameters before proceeding
        if (!queryParams.versionUrl) {
            showError('Cannot continue: no dataset version URL was provided by Dataverse');
            return;
        }
        if (!queryParams.fileUrl) {
            showError('Cannot continue: no file URL was provided by Dataverse');
            return;
        }

        // resolves to false when the file or its metadata could not be retrieved
        var metadataReady = fetchFileMetadata(queryParams.versionUrl, queryParams.fileid)
            .then(fileMetadata => {
                if (fileMetadata) {
                    console.log('Retrieved file metadata:', fileMetadata);
                    g_fileMetadata = fileMetadata;
                    // only for json we should check if it is a GMF JSON file
                    if (g_fileMetadata.contentType === 'application/json') {
                        return retrieveJsonFile(queryParams);
                    }
                } else {
                    console.warn(`No metadata found for file ID ${queryParams.fileid}; treating the file as a tabular file`);
                }
            })
            .then(() => true)
            .catch(error => {
                showError('Could not retrieve the file or its metadata from Dataverse', error);
                return false;
            });

        metadataReady.then(ok => {
            if (!ok) {
                return;
            }
            // metadata has been retrieved and stored in g_fileMetadata if available
            // g_isGmf indicates whether the file is a GMF JSON file or not
            console.log('Metadata is ready. g_fileMetadata:', g_fileMetadata);
            if (g_fileMetadata) {
                showStatus(`Ready: ${g_fileMetadata.filename || 'file'} (${g_fileMetadata.contentType}) will be handled as a ${g_isGmf ? 'GMF JSON' : 'tabular'} file.`);
            } else {
                showStatus('Ready: no file metadata found, the file will be handled as a tabular file.');
            }
            // enable a button to pass the file to an external tool
            var button = document.createElement('button');
            if (g_isGmf) {
                button.textContent = `Pass GMF JSON file to External Tool; create synthetic data`;
                button.onclick = function() {
                    // already got the file content in g_fileContent
                    metadataReady
                    .then(() => {
                        displayFileContent(g_fileContent);
                        synthFileToolSynthesize(g_fileContent); 
                    });
                };
            } else {
                button.textContent = `Pass tabular file to External Tool; create GMF JSON`;
                // need to get the file content first
                button.onclick = function() {
                metadataReady
                    .then(() => {
                        showStatus('Retrieving the file content...');
                        return fetch(queryParams.fileUrl);
                    })
                    .then(checkResponse)
                    .then(response => response.text())
                    .then(fileContent => {
                        // Note that we have the whole file content already...
                        displayFileContent(fileContent);
                        // there is no waiting... just displaying is not a real problem, it does not change
                        // we can try start processing immediately for now
                        synthFileToolFitModel(fileContent);
                    })
                    .catch(error => {
                        showError('Could not retrieve the file content', error);
                    });
                };
            }

            document.body.appendChild(button);
        });
    }

    // main entry point
    window.onload = function() {
        var queryParams = {};

        // get the query parameters from the URL
        var urlParams = new URLSearchParams(window.location.search);
        
        displayUrlParams(urlParams);

        var locale = urlParams.get('locale');
        if (locale == null) {
            locale = 'en';
        }

        // From the guide: For tools invoked via a GET call, 
        // Dataverse will include a callback query parameter with a Base64 encoded value. 
        // The decoded value is a signed URL that can be called to retrieve a JSON response 
        // containing all of the queryParameters and allowedApiCalls specified 
        // in the manifest.
        if (urlParams.has("callback")) {
            var callback = atob(urlParams.get("callback"));
            console.log('Decoded callback URL:', callback);

            showStatus('Retrieving the tool parameters from Dataverse...');
            fetch(callback, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
            })
            .then(checkResponse)
            .then(response => response.json())
            .then(json => {
                console.log('Callback Response:', json.data);

                queryParams = json.data.queryParameters;
                var urls = json.data.signedUrls;
                for (var i in urls) {
                    var url = urls[i];
                    switch (url.name) {
                        case 'retrieveFileContents':
                            queryParams.fileUrl = url.signedUrl;
                            break;
                        case 'downloadFile':
                            queryParams.fileDownloadUrl = url.signedUrl;
                            break;
                        case 'getDatasetVersionMetadata':
                            queryParams.versionUrl = url.signedUrl;
                            break;
                        case 'retrieveDataFile': // Only got this one configured!
                            queryParams.fileUrl = url.signedUrl;
                            break;
                        default:
                    }
                }
                continueWithParams(queryParams);
            })
            .catch(error => {
                showError('Could not retrieve the tool parameters from Dataverse', error);
            });
        } else {
            // No callback, I guess this is the case for old versions of Dataverse
            // probably I do not want or need to support this, 
            // but copied it from the previewers retriever.js.
            console.log('No callback provided, constructing it');

            // try to extract the parameters from the URL directly
            urlParams.forEach((value, key) => {
                queryParams[key] = value;
            });
            var fileUrl = queryParams.siteUrl + "/api/access/datafile/"
                + queryParams.fileid + "?gbrecs=true";
            var fileDownloadUrl = queryParams.siteUrl + "/api/access/datafile/"
                + queryParams.fileid + "?gbrecs=false";
            var versionUrl = queryParams.siteUrl + "/api/datasets/"
                + queryParams.datasetid + "/versions/"
                + queryParams.datasetversion;
            var apiKey = queryParams.key;
            if (apiKey != null) {
                fileUrl = fileUrl + "&key=" + apiKey;
                fileDownloadUrl = fileDownloadUrl + "&key=" + apiKey;
                versionUrl = versionUrl + "?key=" + apiKey;
            }
            queryParams.fileUrl = fileUrl;
            queryParams.fileDownloadUrl = fileDownloadUrl;
            queryParams.versionUrl = versionUrl;
            continueWithParams(queryParams);
        }

        // nothing to do here, the rest of the logic is in the continueWithParams function, 
        // which is called after we have the query parameters ready.
    };

</script>
</body>
</html>
